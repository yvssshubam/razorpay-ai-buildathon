    required_evidence:
      delivery_proof_committed_timeline: shipping_proof
      invoicing_details: billing_proof
      customer_email_communication: customer_communication
    # ---------------- Fraud and processing (PROVISIONAL) ----------------
  "10.4":
    network: visa
    category: fraud
    provenance: network_docs
    description: Other fraud, card-absent environment. Cardholder denies authorising a card-not-present transaction.
    required_evidence:
      avs_cvv_match_records: billing_proof
      authentication_log: others
      device_and_ip_records: access_activity_log
      prior_undisputed_transaction_link: others
      delivery_to_matched_address: shipping_proof

  "12.5":
    network: visa
    category: processing_error
    provenance: network_docs
    description: Incorrect amount charged relative to what was authorised or agreed.
    required_evidence:
      authorisation_amount_record: billing_proof
      settlement_amount_record: billing_proof
      itemised_invoice: billing_proof
      customer_agreed_pricing: term_and_conditions

  "12.6":
