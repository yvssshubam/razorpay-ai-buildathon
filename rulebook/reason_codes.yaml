  # ---------------- Razorpay ----------------
  "RZP00":
    network: razorpay
    category: customer_dispute
    description: Dispute fits no existing category.
    variable_requirements: true
    required_evidence:
      delivery_proof_committed_timeline: shipping_proof
      invoicing_details: billing_proof
      customer_email_communication: customer_communication
      refund_details: refund_confirmation

  "RZP01":
