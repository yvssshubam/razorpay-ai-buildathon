      customer_interaction_records: customer_communication
      terms_and_conditions: term_and_conditions

  "1102":
    network: rupay
    category: processing_error
    description: Retrieval request not fulfilled in time.
    required_evidence:
      delivery_proof: proof_of_service
      customer_interaction_records: customer_communication
      terms_and_conditions: term_and_conditions

  "1103":
    network: rupay
    category: processing_error
    description: Invalid documents submitted against a retrieval request.
    required_evidence:
      delivery_proof: proof_of_service
      customer_interaction_records: customer_communication
      terms_and_conditions: term_and_conditions

  # ---------------- American Express ----------------
  "C02":
    network: amex
    category: customer_dispute
    description: Promised credit or refund never processed.
    required_evidence:
      credit_issuance_proof: refund_confirmation
      refund_date_and_amount: refund_confirmation
