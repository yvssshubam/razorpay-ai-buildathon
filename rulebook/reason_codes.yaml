# Chargeback reason code -> evidence rulebook.
#
# VERIFIED against https://razorpay.com/docs/payments/disputes/submit-evidence/
# and https://razorpay.com/docs/api/disputes/contest/ on 2026-08-27.
#
# TWO CAVEATS, both load-bearing:
#
# 1. Razorpay labels these "Suggested Documents", not required documents. This
#    rulebook treats the full suggested list as the completeness bar. That is
#    OUR modelling choice, made because a partial packet is the failure mode
#    worth measuring. It is not a claim about what the networks mandate.
#
# 2. The api_field mapping is OUR INFERENCE. Razorpay publishes the suggested
#    documents and, separately, the fixed evidence slots the contest API
#    accepts. It does not publish a mapping between them. Every api_field below
#    is our judgement about which slot a document belongs in. Flagged here
#    because a reviewer from Razorpay will know their docs do not contain it.

meta:
  version: 3
  verified_on: 2026-08-27
  sources:
    - https://razorpay.com/docs/payments/disputes/submit-evidence/
    - https://razorpay.com/docs/api/disputes/contest/

  # Provenance applies per entry. Codes carry razorpay_docs unless they say
  # otherwise, so only the exceptions are tagged.
  default_provenance: razorpay_docs
  provenance_levels:
    razorpay_docs: >
      Verified against Razorpay's submit-evidence page on 2026-08-27.
      Authoritative for this project.
    network_docs: >
      PROVISIONAL. Razorpay's page groups codes under four category tabs
      (Customer Dispute, Fraud, Authorisation Error, Processing Error). Only
      the Customer Dispute tab was retrievable, so fraud and processing-error
      codes here are compiled from card-network reason-code documentation via
      third-party references and are NOT confirmed against Razorpay's own
      mapping. Anything measured against these entries carries that caveat.

  caveat_suggested_not_required: >
    Razorpay labels these "Suggested Documents", not required documents. This
    rulebook treats the full suggested list as the completeness bar. That is
    our modelling choice, made because a partial packet is the failure mode
    worth measuring, not a claim about what the networks mandate.

  caveat_api_mapping: >
    The api_field mapping is our inference. Razorpay publishes the suggested
    documents and, separately, the evidence slots the contest API accepts. It
    does not publish a mapping between them.

  supersedes: >
    v1 was transcribed from memory: RZP01 was modelled as a duplicate-charge
    code (it is goods-not-provided), Visa 13.1 required a non-existent
    avs_result, and 1064 required an ip_record that does not exist. v2
    corrected those but covered only the Customer Dispute tab and omitted the
    fraud codes the case taxonomy depends on. v3 adds them under a separate
    provenance level rather than presenting them as equally verified.

# The evidence slots the contest API actually accepts. A packet that does not
# map onto these fields cannot be submitted, however complete it looks.
api_evidence_fields:
  - shipping_proof
  - billing_proof
  - cancellation_proof
  - customer_communication
  - proof_of_service
  - explanation_letter
  - refund_confirmation
  - access_activity_log
  - refund_cancellation_policy
  - term_and_conditions
  - others            # takes {type, document_ids}

codes:

  # ---------------- UPI ----------------
  "1061":
    network: upi
    category: customer_dispute
    description: Refund not processed after cancellation or return.
    required_evidence:
      refund_generation_proof: refund_confirmation
      bank_statement_matching_amount: refund_confirmation
      customer_refund_confirmation: customer_communication
      refund_policy: refund_cancellation_policy

  "1062":
    network: upi
    category: customer_dispute
    description: Goods or services differed materially from the description.
    required_evidence:
      product_description_screenshots: others
      delivery_proof: proof_of_service
      customer_dissatisfaction_comms: customer_communication
      return_policy: refund_cancellation_policy

  "1064":
    network: upi
    category: customer_dispute
    description: Goods or services never delivered.
    required_evidence:
      delivery_proof: proof_of_service
      customer_interaction_records: customer_communication
      terms_and_conditions: term_and_conditions

  # ---------------- Visa ----------------
  "13.1":
    network: visa
    category: customer_dispute
    description: Merchandise or services not received.
    required_evidence:
      delivery_confirmation_signed: shipping_proof
      tracking_information: shipping_proof
      service_completion_records: proof_of_service
      digital_delivery_logs: access_activity_log
      customer_acknowledgement: customer_communication

  "13.2":
    network: visa
    category: customer_dispute
    description: Recurring charge after the customer cancelled.
    required_evidence:
      cancellation_policy: refund_cancellation_policy
      no_cancellation_request_proof: cancellation_proof
      continued_usage_logs: access_activity_log
      terms_of_service: term_and_conditions
      cancellation_window_proof: refund_cancellation_policy

  "13.3":
    network: visa
    category: customer_dispute
    description: Item not as described or defective.
    required_evidence:
      product_description_images: others
      quality_control_records: others
      no_return_received: others
      no_customer_contact_proof: customer_communication
      terms_and_conditions: term_and_conditions

  "13.4":
    network: visa
    category: customer_dispute
    description: Counterfeit merchandise.
    required_evidence:
      authenticity_certificates: others
      supplier_verification: others
      brand_authorisation: others
      product_source_documentation: others
      quality_guarantees: explanation_letter

  "13.5":
    network: visa
    category: customer_dispute
    description: Terms of sale misrepresented.
    required_evidence:
      marketing_materials: others
      clear_terms_display: term_and_conditions
      customer_acknowledgement: customer_communication
      no_misleading_claims_proof: explanation_letter
      contract_terms: term_and_conditions

  "13.6":
    network: visa
    category: customer_dispute
    description: Promised refund or credit never processed.
    required_evidence:
      refund_processing_proof: refund_confirmation
      credit_timestamp: refund_confirmation
      return_not_received: others
      refund_policy_compliance: refund_cancellation_policy
      transaction_reversal_records: refund_confirmation

  "13.7":
    network: visa
    category: customer_dispute
    description: Charged despite cancellation before shipment.
    required_evidence:
      no_cancellation_received: cancellation_proof
      cancellation_policy_terms: refund_cancellation_policy
      order_already_shipped: shipping_proof
      cancellation_window_missed: refund_cancellation_policy
      terms_agreement: term_and_conditions

  "13.8":
    network: visa
    category: processing_error
    description: Original Credit Transaction rejected by the network.
    required_evidence:
      valid_account_verification: billing_proof
      oct_rules_compliance: explanation_letter
      alternative_refund_method: refund_confirmation
      transaction_approval_records: billing_proof

  # ---------------- Mastercard ----------------
  "4841":
    network: mastercard
    category: customer_dispute
    description: Recurring or digital goods charge after cancellation.
    required_evidence:
      cancellation_policy: refund_cancellation_policy
      no_cancellation_received: cancellation_proof
      service_usage_after_date: access_activity_log
      terms_of_service: term_and_conditions
      digital_access_logs: access_activity_log

  "4850":
    network: mastercard
    category: processing_error
    description: Instalment plan terms or schedule violated.
    required_evidence:
      installment_agreement: term_and_conditions
      payment_schedule: billing_proof
      terms_compliance: term_and_conditions
      customer_consent: customer_communication
      billing_records: billing_proof

  "4853":
    network: mastercard
    category: customer_dispute
    description: General cardholder dispute; evidence varies by underlying claim.
    variable_requirements: true
    required_evidence:
      delivery_proof: proof_of_service
      quality_records: others
      product_description: others
      return_policy: refund_cancellation_policy
      customer_communication_records: customer_communication

  "4854":
    network: mastercard
    category: customer_dispute
    description: Cardholder dispute not elsewhere classified.
    variable_requirements: true
    required_evidence:
      valid_transaction_proof: billing_proof
      delivery_or_service_proof: proof_of_service
      customer_agreement: term_and_conditions

  # ---------------- RuPay ----------------
  "RUPAY-1061":
    network: rupay
    category: customer_dispute
    description: Refund not processed after cancellation or return.
    required_evidence:
      refund_generation_proof: refund_confirmation
      bank_statement_matching_amount: refund_confirmation
      customer_refund_confirmation: customer_communication
      refund_policy: refund_cancellation_policy

  "RUPAY-1062":
    network: rupay
    category: customer_dispute
    description: Goods differed from description or were defective.
    required_evidence:
      product_description_screenshots: others
      delivery_proof: proof_of_service
      customer_dissatisfaction_comms: customer_communication
